plugins {
    id "com.android.library" version "8.4.2"
}

def propOr = { key, fallback ->
    return rootProject.hasProperty(key) ? rootProject.property(key) : fallback
}

def compileSdk = propOr("flutter.compileSdkVersion", 35).toInteger()
def minSdk = propOr("flutter.minSdkVersion", 21).toInteger()
def targetSdk = propOr("flutter.targetSdkVersion", 35).toInteger()

android {
    namespace "io.flutterfastkit.fk_user_agent"
    compileSdkVersion compileSdk

    defaultConfig {
        minSdkVersion minSdk
        targetSdkVersion targetSdk
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // (Add only needed dependencies; keep empty if none)
}